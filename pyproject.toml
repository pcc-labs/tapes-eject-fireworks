[project]
name = "tapes-eject-fireworks"
version = "0.1.0"
description = "Paper labels to a Fireworks serverless LoRA fine-tune"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
tapes-eject = "tapes_eject.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]
# Act 3, Fireworks serverless training: `uv sync --group train`. No GPU needed; torch and
# transformers are only here for the tokenizer and chat renderer the cookbook uses client-side.
train = ["fireworks-training-cookbook"]

[tool.uv.sources]
fireworks-training-cookbook = { git = "https://github.com/fw-ai/cookbook", subdirectory = "training", rev = "64122feb986449eddd7b377df22e99e0d06f35bd" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapes_eject"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
